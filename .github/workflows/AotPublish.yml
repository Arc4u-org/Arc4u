name: Native AOT publish

# Publishes src/Samples/Arc4u.AotPublishTest with PublishAot=true (issue #277). Every Arc4u assembly is rooted, so the AOT
# compiler analyzes all of their code. Any trim or AOT warning in Arc4u fails the job.
on:
  pull_request:
    branches:
      - 'master'
      - 'develop/9.0.0'
    paths:
      - 'src/**'
      - '.github/workflows/AotPublish.yml'
  push:
    branches:
      - 'master'
      - 'develop/9.0.0'
    paths:
      - 'src/**'
      - '.github/workflows/AotPublish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish with Native AOT
        # The project treats every Arc4u warning as an error. IL2037 stays a warning because EF Core raises one in its own code,
        # so the grep fails the job on any IL warning located in an Arc4u member.
        run: |
          set -o pipefail
          dotnet publish src/Samples/Arc4u.AotPublishTest -c Release -o aot-out 2>&1 | tee publish.log
          if grep -E '(warning|error) IL[0-9]{4}: Arc4u\.' publish.log; then
            echo "::error::Arc4u has trim or AOT warnings in the Native AOT publish."
            exit 1
          fi

      - name: Run the native binary
        run: ./aot-out/Arc4u.AotPublishTest
