name: Build And Publish

permissions:
  id-token: write   # required for GitHub OIDC
on: 
  workflow_call:
    inputs:
      nugetVersion:
        description: 'nuget version number x.y.z.w'     
        required: false
        type: string
      nugetVersionSpecific:
        description: 'nuget version number z.w for specific packages'     
        required: false
        type: string
      nugetPreviewName:
        description: 'nuget preview ?'     
        required: false
        type: string
      nugetPackageIdPrefix:
        description: 'NuGet PackageId prefix (include the period if necessary)'
        required: false
        type: string
      publish:
        description: 'Publish to nuget.org?' 
        type: string
        required: true
    secrets:
       NUGET_USER:
         required: true
        
env:
  solution: '**/*.slnx'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'  
  netStandardVersion: '${{ github.event.inputs.nugetVersion }}'
  netStandardVersionNuget: '${{ github.event.inputs.nugetVersion }}${{ github.event.inputs.nugetPreviewName }}'
  PublishToNuget: ${{ github.event.inputs.publish }}

jobs:
  build:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: windows-latest
    steps:
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
             
      - uses: actions/checkout@v7

      # The SDK pinned in src/global.json (rollForward disabled) is required.
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Set the NuGet PackageId in the project files
        run: .\src\Builds\SetNuGetPackageIdPrefix.ps1 ".." "${{ github.event.inputs.nugetPackageIdPrefix }}"
        shell: powershell         

      - name: nuget restore
        run: dotnet restore .\src\arc4u.slnx
 
      - name: build
        run: dotnet build .\src\arc4u.slnx --configuration ${{env.buildConfiguration}} /p:Version=${{env.netStandardVersionNuget}}
 
      # --no-build: test the assemblies the build step packed. A rebuild here would run
      # without /p:Version and pack a second, 1.0.0 version of the packages.
      - name: Run Test projects matching *UnitTest.csproj with filter Category = CI
        run: |
            Get-ChildItem -Filter *.*UnitTest.csproj -Recurse | ForEach-Object { dotnet test $_.FullName --no-build -c ${{ env.buildConfiguration }} --filter 'Category = CI' }
        shell: pwsh     
 
      - name: Copy the nuget packages to a folder to have only one published.
        run: |
            md .\packages 
            Get-ChildItem -Path .\ -Recurse -Filter "*.${{ env.netStandardVersionNuget }}.nupkg" |  ForEach-Object { Copy-Item -Path $_.FullName -Destination (".\packages\"+$_.Name) }
        shell: pwsh  
 
      - name: Save nuget packages
        if: ${{ env.PublishToNuget == 'false'  }}
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: |
            ./packages
          retention-days: 1

      - name: Publish packages
        if: ${{ env.PublishToNuget == 'true'  }}
        run: dotnet nuget push ".\packages\*.nupkg" --skip-duplicate --no-symbols --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json

#        run: dotnet nuget push ".\packages\*.nupkg" --skip-duplicate --no-symbols --api-key ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
