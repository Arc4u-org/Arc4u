name: SonarBuild

# SonarCloud analysis, started manually. Needs the SONAR_TOKEN secret.
# The scanner needs Java 17 or later.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  buildConfiguration: 'Release'

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # src/global.json pins the SDK with rollForward disabled.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      # The build must run between begin and end to be analyzed.
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"GFlisch_Arc4u" /o:"gflisch" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.scanner.scanAll=false /d:sonar.host.url="https://sonarcloud.io"
          dotnet build .\src\Arc4u.slnx --configuration ${{ env.buildConfiguration }}
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
