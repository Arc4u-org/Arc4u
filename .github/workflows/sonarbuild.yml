name: SonarBuild

# Analyzes develop/9.0.0 on SonarCloud on every push, and on demand for any branch.
# In SonarCloud, develop/9.0.0 must match the long-lived branch pattern (or be the main
# branch), otherwise it is purged as a short-lived branch after 30 days without analysis.
# Automatic Analysis must be disabled in SonarCloud: it conflicts with this CI analysis.

on:
  push:
    branches:
      - 'develop/9.0.0'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  buildConfiguration: 'Release'

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      # The SonarScanner needs Java 17 or later.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # The SDK pinned in src/global.json (rollForward disabled) is required.
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/global.json', 'src/Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: nuget restore
        run: dotnet restore .\src\arc4u.slnx

      # Test failures do not stop the analysis: ci.yml is the check that reports them.
      - name: Build, test and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"GFlisch_Arc4u" /o:"gflisch" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.scanner.scanAll=false /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          dotnet build .\src\arc4u.slnx --no-restore --configuration ${{ env.buildConfiguration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Filter *.*UnitTest.csproj -Recurse | ForEach-Object {
              dotnet test $_.FullName --no-build -c ${{ env.buildConfiguration }} --filter 'Category = CI' --collect "XPlat Code Coverage;Format=opencover" --results-directory TestResults
          }
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
