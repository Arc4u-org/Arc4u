name: CodeQL

# Static security analysis of the C# code and of the GitHub Actions workflows.
# Alerts are listed under Security -> Code scanning.
# C# uses build-mode none: no build and no preview SDK needed.
# The weekly schedule only runs from the default branch (master).

on:
  push:
    branches:
      - 'develop/9.0.0'
      - 'master'
  pull_request:
    branches:
      - 'develop/9.0.0'
      - 'master'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # upload the results to code scanning
    concurrency:
      group: codeql-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
