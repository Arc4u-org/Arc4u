# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# The default branch is master, so every entry targets the development line explicitly.

version: 2
updates:
  # NuGet packages, centrally managed in src/Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/src"
    target-branch: "develop/9.0.0"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop/9.0.0"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
